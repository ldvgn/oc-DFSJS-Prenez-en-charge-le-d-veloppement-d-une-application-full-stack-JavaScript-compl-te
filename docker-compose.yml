services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16
    container_name: postgres_test
    profiles: [test]                     # ignored by a plain `docker compose up`
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: mdd_test
    ports: ["5433:5432"]                 # different port from the dev database
    tmpfs: [/var/lib/postgresql/data]    # in RAM: fast and wiped on every stop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d mdd_test"]
      interval: 2s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    profiles: [sonar]                    # started on demand: npm run sonar:up
    ports: ["9000:9000"]
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions: