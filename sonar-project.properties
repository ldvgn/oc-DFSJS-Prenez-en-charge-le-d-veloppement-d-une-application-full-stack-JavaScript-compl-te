sonar.projectKey=oc-monde-du-dev
sonar.projectName=MDD - Monde Du Dev
sonar.host.url=http://localhost:9000
# Token read from SONAR_TOKEN (.env)

sonar.sources=app,components,lib,modules,proxy.ts
sonar.tests=app,components,lib,modules,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,components/ui/**,prisma/generated/**
sonar.coverage.exclusions=components/ui/**

# Unit/integration (npm run test:coverage) + e2e (npm run test:e2e:coverage)
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/e2e/lcov.info
